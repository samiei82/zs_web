<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Date</h1>
    <hr>
    <h2 id="clock"></h2>
    <script>
        const date=new Date();
        document.getElementById("clock").innerHTML = 
        `${date.getHours()}:${date.getMinutes()}:${date.getSeconds()}`;
        console.log(date);
    </script>
</body>
</html>
