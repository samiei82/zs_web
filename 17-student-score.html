<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="./assets/styles/bootstrap.min.css" />
    <title>Student Scoure</title>
</head>
<body>
    <div class="container">
       <div class="row">
         <div class="col-md-6" >
            <div class="input-group">
                <input type="number"
                placeholder="score..."
                class="form-control"
                id="txtScore">
            </div>
            <button class="btn btn-outline-success" onclick="addScoure(txtScore.value)">Add Score</button>
        </div>
        <div class="col-md-6">

        </div>
       </div>
    </div>
    <script>
        //debugger;
        const arrScores=[];
        function addScoure(score){     
            const s = Number(score);       
            arrScores.push(s);
            document.getElementById("txtScore").value="";
            console.log(arrScores);
        }
    </script>
</body>
</html>
