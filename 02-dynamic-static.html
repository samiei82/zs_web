<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>About me:</h1>
  <hr/>

  <h2>Dynamic</h2>
  <h3>I'm <span id="age"></span>years old. </h3>
  <script>
    const date = new Date();
    document.getElementById("age").innerHTML = date.getFullYear() -1982;
  </script>
</body>
</html>
