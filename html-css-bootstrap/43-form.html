<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .form-label {
        display: block;
      }
      .form-control {
        display: block;
        width: 90%;
        padding: 4px;
        margin: 3px 0;
        border-radius: 5px;
        border: 2px solid lightblue;
      }
    .mb-3 {
      margin-bottom: 1rem;
    }
    </style>
  </head>
  <body>
    <h1>Form</h1>
    <hr />
    <!-- 
    برای گرفتن اطلاعات از کاربر از فرم استفاده میشود

input => type = text
                password
                checkbox
                radio
                tel
label
-->
<form action="https://www.w3schools.com/action_page.php" target="_blank" method="post">
  <div class="mb-3">
    <label class="form-label" for="userName">User Name:</label>
    <input class="form-control" type="text" id="userName" name="UserName" placeholder="userName" required maxlength="70" minlength="5" readonly value=""/>
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Passowrd:</label>
    <input class="form-control" id="password" type="password" name="Password" placeholder="password"/>
  </div>
  <div class="mb-3">
    <input type="checkbox" id="rememberMe">
    <label for="rememberMe">remember me on next login.</label>
  </div>
  <div class="mb-3">
    <div>
      <input type="radio" id="female" name="Gender" value="Female">
      <label for="female">Female</label>
    </div>
    <div>
      <input type="radio" name="Gender" id="male" value="Male">
      <label for="male">Male</label>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label" for="mobile">Mobile</label>
    <input class="form-control" type="tel" placeholder="09XX-XXX-XXXX" id="mobile" name="Mobile">
  </div>

  <div class="mb-3">
    <label  class="form-label" for="city">City:</label>
    <select class="form-control"  name="City" id="city">
      <option value="0">انتخاب شهر ...</option>
      <option value="1">تهران</option>
      <option value="2">شیراز</option>
    </select>
  </div>
  <div>
    <input type="submit" >
    <input type="button" value="input-button">
    <input type="reset" name="" id="">
    <button>button tag</button>
  </div>
</form>
  </body>
</html>
