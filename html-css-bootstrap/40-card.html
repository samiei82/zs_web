<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    .card{
      width: 250px;
      height: 400px;
      border: 3px solid rgb(231, 10, 10);

    }

    .card-head img{
      width: 100%;
    }

    .card-body{
      margin: 10px;
    }
    .price{
      color: green;

    }
    .discount{
      color: gray;
      text-decoration: line-through;
    }
    .card .discount-tag img{
      position: absolute;
      top: -10px;
      right: -10px;
      width: 100px;
    }

  </style>
</head>
<body>
  <h1>Card</h1>
  <hr>
  <div class="card">
    <div class="card-head">
      <img src="./assets/image/pizza.jpg" alt="">
      <div class="card-body">
        <h3>pizza panir</h3>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus, quae.</p>
        <h4>
          Price :
          <span class="price">100$</span> 
          <span class="discount">99$</span>
        </h4>
      </div>
      <div class="discount-tag">
        <img src="./assets/image/images.jpg" alt="">
      </div>

    </div>
  </div>
</body>
</html>
