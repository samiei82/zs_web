<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/styles/bootstrap.min.css" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
          <div>
            <label class="form-label" for="NUM1">Nunmber1</label>
            <input class="form-control" type="text" type="text" id="NUM1" />
          </div>
          <div class="mt-3">
            <label class="form-label" for="NUM2">Nunmber2</label>
            <input class="form-control" type="text" type="text" id="NUM2" />
          </div>
          <div class="mt-3">
            <label class="form-label" for="OPR">Operator</label>
            <!-- <input class="form-control" type="se" type="text" id="OPR" /> -->
            <select class="form-select" id="OPR">
              <option selected>Open this select menu</option>
              <option value="1">+</option>
              <option value="2">-</option>
              <option value="3">*</option>
              <option value="4">/</option>
            </select>
          </div>
          <div class="mt-3">
            <label class="form-label" for="RESULT">Result</label>
            <input class="form-control" type="text" id="RESULT" />
          </div>
          <div  class="mt-3">
            <button class="btn btn-primary" onclick="Calculate(NUM1.value, NUM2.value, OPR.value)" >
              Calculate
            </button>

        </div>
        <div class="col-md-4"></div>
      </div>
    </div>
    <script>
      function Calculate(a, b, opr) {
        debugger;
        if (opr == "1") {
          let result = parseFloat(a) + parseFloat(b);
          document.getElementById("RESULT").value = result;
        } else if (opr == "2") {
          let result = parseFloat(a) - parseFloat(b);
          document.getElementById("RESULT").value = result;
        } else if (opr == "3") {
          let result = parseFloat(a) * parseFloat(b);
          document.getElementById("RESULT").value = result;
        } else if (opr == "4") {
          let result = parseFloat(a) / parseFloat(b);
          document.getElementById("RESULT").value = result;
        }
      }
    </script>
  </body>
</html>
